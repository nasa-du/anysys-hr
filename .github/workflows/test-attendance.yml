name: Test Attendance

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-attendance-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create CI environment file
        run: cp .env.example .env
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest-known"
      - run: docker compose up -d --wait db mailpit
      - name: Create test database
        run: uv run bash scripts/create-test-db.sh
        working-directory: backend
      - name: Run golden-case schema and attendance unit tests
        run: uv run pytest tests/attendance -m "not performance"
        working-directory: backend
      - run: docker compose down -v --remove-orphans

  test-attendance-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create CI environment file
        run: cp .env.example .env
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest-known"
      - run: docker compose up -d --wait db mailpit
      - name: Create test database
        run: uv run bash scripts/create-test-db.sh
        working-directory: backend
      - name: Run migration, schema, and seed tests
        run: >-
          uv run pytest
          tests/test_migrations.py
          tests/test_attendance_schema.py
          tests/scripts/test_seed_dev.py
        working-directory: backend
      - run: docker compose down -v --remove-orphans

  attendance-performance-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create CI environment file
        run: cp .env.example .env
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest-known"
      - run: docker compose up -d --wait db mailpit
      - name: Create test database
        run: uv run bash scripts/create-test-db.sh
        working-directory: backend
      - name: Run foundation performance smoke
        run: >-
          uv run pytest
          tests/attendance/test_performance_smoke.py
          -m performance
        working-directory: backend
      - run: docker compose down -v --remove-orphans
